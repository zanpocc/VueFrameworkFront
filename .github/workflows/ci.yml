name: frontend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Lint
        run: yarn lint

      - name: Stylelint
        run: yarn lint:style

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: OpenAPI generated types are current
        if: ${{ vars.OPENAPI_SCHEMA != '' }}
        env:
          OPENAPI_SCHEMA: ${{ vars.OPENAPI_SCHEMA }}
        run: yarn openapi:check

      - name: Unit tests
        run: yarn test:unit

      - name: E2E tests
        run: yarn test:e2e

      - name: Build
        run: yarn build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: playwright-report/**
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/**
          if-no-files-found: ignore
